<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">OryxOS 整体架构</title>
  <desc id="desc">展示 CLI、Web Service 和定时任务通过 AgentService 进入 ReAct 引擎，再调用 Provider、Memory、Tool 和 Sandbox，最终连接模型、SQLite、工作区文件以及 MCP 与企业系统。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="engineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d5dfc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 38px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .layer-label { font: 700 15px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; letter-spacing: 1.5px; }
      .node-title { font: 700 20px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-title-light { font: 700 21px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .node-subtitle { font: 400 14px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .node-subtitle-light { font: 400 14px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .small-title { font: 700 17px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small-subtitle { font: 400 13px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .edge-label { font: 600 13px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .pill { font: 600 12px "Inter", "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>

  <text x="80" y="62" class="title">OryxOS 整体架构</text>
  <text x="80" y="94" class="subtitle">一个统一入口驱动 ReAct，引擎按需调用模型、记忆与受控工具</text>

  <!-- Layer labels -->
  <g>
    <rect x="45" y="137" width="8" height="100" rx="4" fill="#3b82f6"/>
    <text x="70" y="192" class="layer-label" transform="rotate(-90 70 192)">接入层</text>

    <rect x="45" y="285" width="8" height="88" rx="4" fill="#0ea5e9"/>
    <text x="70" y="344" class="layer-label" transform="rotate(-90 70 344)">服务层</text>

    <rect x="45" y="417" width="8" height="174" rx="4" fill="#7c3aed"/>
    <text x="70" y="543" class="layer-label" transform="rotate(-90 70 543)">引擎层</text>

    <rect x="45" y="645" width="8" height="135" rx="4" fill="#10b981"/>
    <text x="70" y="754" class="layer-label" transform="rotate(-90 70 754)">能力层</text>

    <rect x="45" y="846" width="8" height="128" rx="4" fill="#64748b"/>
    <text x="70" y="946" class="layer-label" transform="rotate(-90 70 946)">基础设施</text>
  </g>

  <!-- Access layer -->
  <g filter="url(#softShadow)">
    <rect x="150" y="135" width="330" height="102" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="195" cy="186" r="22" fill="#dbeafe"/>
    <path d="M184 178h22M184 186h15M184 194h19" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="232" y="180" class="node-title">CLI Channel</text>
    <text x="232" y="205" class="node-subtitle">本地交互、调试与人工补跑</text>

    <rect x="635" y="135" width="330" height="102" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="680" cy="186" r="22" fill="#dbeafe"/>
    <path d="M669 176h22v20h-22zM674 181h12M674 187h12" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="717" y="180" class="node-title">Web Service</text>
    <text x="717" y="205" class="node-subtitle">REST API 与业务系统集成</text>

    <rect x="1120" y="135" width="330" height="102" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="1165" cy="186" r="22" fill="#dbeafe"/>
    <circle cx="1165" cy="186" r="12" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M1165 178v9l7 4" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1202" y="180" class="node-title">AgentScheduler</text>
    <text x="1202" y="205" class="node-subtitle">Cron 定时触发与进程内防重叠</text>
  </g>

  <!-- Access to service -->
  <path d="M315 237 V268 H735" class="edge"/>
  <path d="M800 237 V268" class="edge"/>
  <path d="M1285 237 V268 H865" class="edge"/>
  <rect x="699" y="251" width="202" height="25" rx="12" fill="#eef2ff"/>
  <text x="800" y="268" class="edge-label" text-anchor="middle">统一内部消息模型</text>

  <!-- Service layer -->
  <g filter="url(#shadow)">
    <rect x="535" y="286" width="530" height="88" rx="22" fill="url(#serviceGradient)"/>
    <text x="800" y="324" class="node-title-light" text-anchor="middle">AgentService</text>
    <text x="800" y="350" class="node-subtitle-light" text-anchor="middle">统一编排入口 · ProfileContext · Session 持久化</text>
  </g>

  <path d="M800 374 V419" class="edge-purple"/>

  <!-- Engine layer container -->
  <g filter="url(#shadow)">
    <rect x="118" y="418" width="1364" height="174" rx="26" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <rect x="118" y="418" width="1364" height="42" rx="26" fill="#f5f3ff"/>
    <rect x="118" y="440" width="1364" height="20" fill="#f5f3ff"/>
    <text x="148" y="445" class="layer-label" fill="#6d28d9">ORYXOS REACT ENGINE</text>

    <rect x="164" y="484" width="276" height="76" rx="16" fill="#fafafa" stroke="#e2e8f0" stroke-width="2"/>
    <text x="302" y="516" class="small-title" text-anchor="middle">ContextLoader</text>
    <text x="302" y="540" class="small-subtitle" text-anchor="middle">AGENT.md · Bootstrap · 子资源</text>

    <rect x="498" y="484" width="276" height="76" rx="16" fill="#fafafa" stroke="#e2e8f0" stroke-width="2"/>
    <text x="636" y="516" class="small-title" text-anchor="middle">PromptBuilder</text>
    <text x="636" y="540" class="small-subtitle" text-anchor="middle">上下文 · Memory · 历史 · Tool Schema</text>

    <rect x="832" y="474" width="276" height="96" rx="18" fill="url(#engineGradient)"/>
    <text x="970" y="514" class="node-title-light" text-anchor="middle">ReActLoop</text>
    <text x="970" y="540" class="node-subtitle-light" text-anchor="middle">Reason → Act → Observe</text>

    <rect x="1166" y="484" width="270" height="76" rx="16" fill="#fafafa" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1301" y="516" class="small-title" text-anchor="middle">ToolExecutor</text>
    <text x="1301" y="540" class="small-subtitle" text-anchor="middle">校验 · 执行 · 结果回填 · 审计</text>
  </g>

  <path d="M440 522 H498" class="edge"/>
  <path d="M774 522 H832" class="edge-purple"/>
  <path d="M1108 522 H1166" class="edge"/>
  <path d="M1301 560 V580 H970 V570" class="edge-dashed"/>
  <text x="1128" y="582" class="edge-label">ToolResult 回填</text>

  <!-- Capability layer -->
  <g filter="url(#softShadow)">
    <rect x="118" y="646" width="310" height="134" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="166" cy="690" r="21" fill="#d1fae5"/>
    <path d="M157 696c4-15 14-15 18 0M160 680h12" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/>
    <text x="202" y="688" class="node-title">ProviderService</text>
    <text x="151" y="725" class="node-subtitle">显式 Provider → ChatModel 映射</text>
    <rect x="151" y="742" width="118" height="23" rx="11" fill="#d1fae5"/>
    <text x="210" y="758" class="pill" text-anchor="middle">Spring AI 适配</text>

    <rect x="469" y="646" width="310" height="134" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="517" cy="690" r="21" fill="#dbeafe"/>
    <path d="M507 681h20v18h-20zM511 686h12M511 691h9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="553" y="688" class="node-title">MemoryService</text>
    <text x="502" y="725" class="node-subtitle">会话记忆 · 长期记忆统一门面</text>
    <rect x="502" y="742" width="148" height="23" rx="11" fill="#dbeafe"/>
    <text x="576" y="758" class="pill" text-anchor="middle">LongTermMemoryStore</text>

    <rect x="820" y="646" width="310" height="134" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="868" cy="690" r="21" fill="#ffedd5"/>
    <path d="M858 681l20 18M878 681l-20 18" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round"/>
    <text x="904" y="688" class="node-title">ToolRegistry</text>
    <text x="853" y="725" class="node-subtitle">内置 Tool · MCP Tool · Java Tool</text>
    <rect x="853" y="742" width="113" height="23" rx="11" fill="#ffedd5"/>
    <text x="909" y="758" class="pill" text-anchor="middle">OryxTool</text>

    <rect x="1171" y="646" width="311" height="134" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="1219" cy="690" r="21" fill="#fee2e2"/>
    <path d="M1219 678l12 5v9c0 8-5 13-12 17-7-4-12-9-12-17v-9z" fill="none" stroke="#dc2626" stroke-width="2.4"/>
    <text x="1255" y="688" class="node-title">Sandbox</text>
    <text x="1204" y="725" class="node-subtitle">路径 · 命令 · 域名白名单</text>
    <rect x="1204" y="742" width="139" height="23" rx="11" fill="#fee2e2"/>
    <text x="1273" y="758" class="pill" text-anchor="middle">WhitelistSandbox</text>
  </g>

  <!-- Engine to capabilities -->
  <path d="M970 592 V619 H273 V646" class="edge"/>
  <path d="M636 560 V619 H624 V646" class="edge"/>
  <path d="M1301 592 V619 H975 V646" class="edge"/>
  <path d="M1130 713 H1171" class="edge"/>

  <!-- Infrastructure -->
  <g filter="url(#softShadow)">
    <rect x="118" y="847" width="310" height="127" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="273" y="887" class="node-title" text-anchor="middle">LLM Providers</text>
    <text x="273" y="914" class="node-subtitle" text-anchor="middle">DeepSeek · Kimi · OpenAI-compatible</text>
    <text x="273" y="939" class="small-subtitle" text-anchor="middle">以及企业本地推理服务</text>

    <rect x="469" y="847" width="310" height="127" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="624" y="887" class="node-title" text-anchor="middle">SQLite</text>
    <text x="624" y="914" class="node-subtitle" text-anchor="middle">Session · LLM Call · Tool Invocation</text>
    <text x="624" y="939" class="small-subtitle" text-anchor="middle">.oryxos/oryxos.db</text>

    <rect x="820" y="847" width="310" height="127" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="975" y="887" class="node-title" text-anchor="middle">Workspace Files</text>
    <text x="975" y="914" class="node-subtitle" text-anchor="middle">Agent · Bootstrap · Memory · Scripts</text>
    <text x="975" y="939" class="small-subtitle" text-anchor="middle">用户可维护、可版本管理</text>

    <rect x="1171" y="847" width="311" height="127" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1326" y="887" class="node-title" text-anchor="middle">External Capabilities</text>
    <text x="1326" y="914" class="node-subtitle" text-anchor="middle">MCP Server · 企业 API · Webhook</text>
    <text x="1326" y="939" class="small-subtitle" text-anchor="middle">工具与外部世界</text>
  </g>

  <!-- Capabilities to infrastructure -->
  <path d="M273 780 V847" class="edge"/>
  <path d="M624 780 V847" class="edge"/>
  <path d="M670 780 V817 H975 V847" class="edge-dashed"/>
  <path d="M975 780 V817 H1326 V847" class="edge"/>
  <path d="M302 560 V816 H975 V847" class="edge-dashed"/>

  <!-- Persistence path from AgentService -->
  <path d="M1065 330 H1515 V810 H700 V847" class="edge-dashed"/>
  <rect x="1365" y="794" width="133" height="25" rx="12" fill="#f1f5f9"/>
  <text x="1431" y="811" class="edge-label" text-anchor="middle">Session / 审计</text>

  <!-- Footer legend -->
  <g transform="translate(118 1012)">
    <circle cx="7" cy="0" r="6" fill="#3b82f6"/>
    <text x="20" y="5" class="small-subtitle">触发入口</text>
    <circle cx="119" cy="0" r="6" fill="#7c3aed"/>
    <text x="132" y="5" class="small-subtitle">核心引擎</text>
    <circle cx="237" cy="0" r="6" fill="#10b981"/>
    <text x="250" y="5" class="small-subtitle">运行能力</text>
    <circle cx="354" cy="0" r="6" fill="#64748b"/>
    <text x="367" y="5" class="small-subtitle">外部与持久化</text>
  </g>
</svg>
